# Google Cloud Build CI/CD Pipeline -> Automated Pytest, Conformance & Cloud Run Deployment
steps:
  - name: "python:3.12-slim"
    id: "unit-and-conformance-tests"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        pip install -e ".[dev]"
        pytest tests -v
        python -m mcpguard_adk.cli scan ./examples --emit-sarif reports/mcpguard.sarif.json --emit-test-json reports/regression.test.json

  - name: "gcr.io/cloud-builders/docker"
    id: "build-cloud-run-image"
    args: ["build", "-t", "gcr.io/$PROJECT_ID/mcpguard-adk:$SHORT_SHA", "."]
    
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-cloud-run"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "mcpguard-adk"
      - "--image=gcr.io/$PROJECT_ID/mcpguard-adk:$SHORT_SHA"
      - "--region=us-central1"
      - "--platform=managed"
      - "--allow-unauthenticated"
options:
  logging: CLOUD_LOGGING_ONLY
