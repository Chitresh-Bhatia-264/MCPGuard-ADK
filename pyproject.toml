[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpguard-adk"
version = "0.3.0"
description = "Multi-agent MCP supply-chain, >200K token cost-cliff, and tool-trajectory auditor built on Google ADK 2.0, A2A Protocol v1.0, and OpenTelemetry."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "MCPGuard-ADK Contributors" }
]
keywords = [
    "google-adk",
    "a2a-protocol",
    "mcp-security",
    "multi-agent-systems",
    "opentelemetry",
    "gemini",
    "python",
    "ai-agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pydantic>=2.7.0",
    "cryptography>=42.0.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "google-genai>=1.0.0",
]

[project.optional-dependencies]
adk = [
    "google-adk>=1.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[project.scripts]
mcpguard = "mcpguard_adk.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcpguard_adk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -p no:locust"
norecursedirs = [".git", ".venv", "venv", "node_modules", "__pycache__", "AppData"]
