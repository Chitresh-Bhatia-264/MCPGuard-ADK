name: "MCPGuard-ADK Security & FinOps PR Auditor"
description: "Audits MCP configs, secrets, Python ADK graphs, and >200K Gemini cost cliffs; posts 1-click inline PR review fixes."
author: "Chitresh Bhatia"

branding:
  icon: "shield"
  color: "blue"

inputs:
  target-path:
    description: "Directory or file path to audit"
    required: false
    default: "."
  git-diff-only:
    description: "Only audit files modified in the pull request"
    required: false
    default: "true"
  fail-on:
    description: "Severity threshold to fail CI check (none, critical, high, medium)"
    required: false
    default: "critical"
  finops-sim:
    description: "Include simulated 1,000-PR Gemini rate-card benchmark in output"
    required: false
    default: "false"
  github-token:
    description: "GitHub token to post inline PR review suggestions"
    required: false
    default: ""
  gemini-api-key:
    description: "Optional Google AI Studio / Gemini API key for live sub-agent summaries"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install MCPGuard-ADK
      shell: bash
      env:
        ACTION_DIR: ${{ github.action_path }}
      run: pip install "$ACTION_DIR"

    - name: Run MCPGuard-ADK PR Review & Inline Suggestion Bot
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GEMINI_API_KEY: ${{ inputs.gemini-api-key }}
        INPUT_TARGET_PATH: ${{ inputs.target-path }}
        INPUT_GIT_DIFF_ONLY: ${{ inputs.git-diff-only }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_FINOPS_SIM: ${{ inputs.finops-sim }}
        OTEL_SEMCONV_STABILITY_OPT_IN: "gen_ai_latest_experimental"
        OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: "EVENT_ONLY"
        ADK_CAPTURE_MESSAGE_CONTENT_IN_SPANS: "false"
      run: |
        args=("pr-review" "$INPUT_TARGET_PATH" "--fail-on" "$INPUT_FAIL_ON")
        if [ "$INPUT_GIT_DIFF_ONLY" = "true" ]; then
          args+=("--git-diff")
        fi
        if [ "$INPUT_FINOPS_SIM" = "true" ]; then
          args+=("--finops-sim")
        fi
        mcpguard "${args[@]}"
